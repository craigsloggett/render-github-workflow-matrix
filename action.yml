name: Render GitHub Workflow Matrix

description: Renders a tool-update workflow matrix from a YAML tools list and version-source registry.

inputs:
  tools:
    description: Tools to render, as a YAML list of entries with tool, scope, files, and optional version_source.
    required: true
  registry:
    description: Version-source registry, as a YAML mapping of tool name to endpoint and jq_filter.
    required: true

outputs:
  json:
    description: The rendered matrix as a compact JSON array, with version_source resolved for every entry.
    value: ${{ steps.render.outputs.json }}

runs:
  using: composite
  steps:
    - name: Render Matrix
      id: render
      run: ${{ github.action_path }}/src/render_github_workflow_matrix.sh
      shell: sh
      env:
        INPUT_TOOLS: ${{ inputs.tools }}
        INPUT_REGISTRY: ${{ inputs.registry }}
